<!DOCTYPE html>
<html lang="en-SG">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Test Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: slim left rail + one content column of cards; orange reserved for actions and highlights */
  --bg:#F1F1EF; --surface:#FFFFFF; --sunk:#F7F7F5; --ink:#1D2023; --muted:#62676E; --line:#E1E0DC;
  --accent:#C9571A; --accent-on:#FFFFFF; --accent-soft:#FCEADD; --accent-ink:#8F3C0F;
  --hi:#A8453D; --hi-soft:#F5E3E0; --med:#8A6D1F; --med-soft:#F2EBD6; --lo:#4F7363; --lo-soft:#E1ECE6;
  --f-display:'Schibsted Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Public Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,22,25,.04), 0 1px 0 rgba(20,22,25,.02);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1D1F22; --sunk:#18191C; --ink:#ECEBE8; --muted:#A0A4AA; --line:#2E3034;
    --accent:#F08A4B; --accent-on:#1A120C; --accent-soft:#3A2618; --accent-ink:#F7B58C;
    --hi:#E08A80; --hi-soft:#3A2321; --med:#D9B866; --med-soft:#332C18; --lo:#8FBBA6; --lo-soft:#1E2E27;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1D1F22; --sunk:#18191C; --ink:#ECEBE8; --muted:#A0A4AA; --line:#2E3034;
  --accent:#F08A4B; --accent-on:#1A120C; --accent-soft:#3A2618; --accent-ink:#F7B58C;
  --hi:#E08A80; --hi-soft:#3A2321; --med:#D9B866; --med-soft:#332C18; --lo:#8FBBA6; --lo-soft:#1E2E27;
  --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1.2} h2{font-size:21px} h3{font-size:18px}
p{margin:0}
a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.88em}
.muted{color:var(--muted)}
.small{font-size:15px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;padding:0 8px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-on)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;font-weight:500;color:var(--muted)}
.nav button:hover{background:var(--surface);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:650}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-foot{margin-top:auto;font-size:14px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}

main{padding:28px clamp(16px,3vw,40px) 64px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top .sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:550;font-size:16px;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink);padding:6px 8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--hi)}
.btn.sm{padding:6px 12px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:1.4fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.tile .k{color:var(--muted);font-size:15px}
.tile .v{font-family:var(--f-display);font-size:34px;font-weight:650;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .s{font-size:14px;color:var(--muted);margin-top:4px}
.tile.accent{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}

.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--r);padding:12px 18px;margin-bottom:18px;font-size:16px}
.banner.warn{background:var(--hi-soft);color:var(--hi)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.chip.High{background:var(--hi-soft);color:var(--hi);border-color:transparent}
.chip.Medium{background:var(--med-soft);color:var(--med);border-color:transparent}
.chip.Low{background:var(--lo-soft);color:var(--lo);border-color:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.pri{font-family:var(--f-mono);font-size:13px}
.chip.P1{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ref{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;padding:3px 10px;border-radius:8px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.ref:hover,.ref:focus-visible{border-color:var(--accent);color:var(--accent-ink)}
.ref .p{color:var(--muted);font-weight:500}
.row-wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Issue cards */
.issues{display:flex;flex-direction:column;gap:12px}
.issue{position:relative;display:grid;grid-template-columns:48px 1fr auto;gap:6px 16px;align-items:start;padding:18px 22px 18px 18px;cursor:pointer;border-left-width:5px}
.issue:hover{border-color:var(--muted)}
.issue.High{border-left-color:var(--hi)} .issue.Medium{border-left-color:var(--med)} .issue.Low{border-left-color:var(--lo)}
.issue .rank{font-family:var(--f-display);font-size:20px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.issue .t{font-size:18px;font-weight:620;line-height:1.35}
.issue .amt{font-family:var(--f-display);font-size:21px;font-weight:650;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.issue .meta{grid-column:2/4;display:flex;flex-direction:column;gap:10px}
.loc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.loc .path{color:var(--ink)}
.cellref{font-family:var(--f-mono);font-size:13px;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.status{font-size:14px;color:var(--muted)}
.issue.closed{opacity:.62}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input[type=search]{flex:1 1 220px;min-width:180px}
.field{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted)}
.field>span{font-weight:550}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:16px;color:var(--ink);min-width:0}
textarea{min-height:92px;resize:vertical;width:100%}
select{padding-right:28px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form .full{grid-column:1/-1}

/* Bars */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:12px;align-items:center;font-size:15px}
.bar .track{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.bar .fill{height:100%;background:var(--muted)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.fill.High{background:var(--hi)} .fill.Medium{background:var(--med)} .fill.Low{background:var(--lo)}
.meter{position:relative;height:16px;border-radius:8px;background:var(--sunk);margin:30px 34px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--accent)}
.meter .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);opacity:.55}
.meter .mk span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:13px;white-space:nowrap;color:var(--muted)}
.meter .mk span.b{top:auto;bottom:-24px}

.top5{display:flex;flex-direction:column}
.top5 button{all:unset;cursor:pointer;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
.top5 button:first-child{border-top:0}
.top5 button:hover .tt{color:var(--accent-ink)}
.top5 .tt{font-weight:560;line-height:1.35}

/* Files */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-family:var(--f-display);font-size:20px;font-weight:650}
.sheet-row{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(200px,1.4fr) 90px 90px auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.sheet-row:first-of-type{border-top:0}
.mapping{grid-column:1/-1;background:var(--sunk);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.grid-t{border-collapse:separate;border-spacing:0;font-size:15px;min-width:100%}
.grid-t th,.grid-t td{padding:7px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:left;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.grid-t thead th{position:sticky;top:0;background:var(--sunk);font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500;z-index:2}
.grid-t td.rn{position:sticky;left:0;background:var(--sunk);font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;z-index:1}
.grid-t td.n{text-align:right;font-variant-numeric:tabular-nums}
.grid-t tr.hdr td{font-weight:650;background:var(--sunk)}
.grid-t tr.flag td{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.grid-t tr.flag td.rn{color:var(--accent-ink);font-weight:700}
.grid-t td.hit{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent);font-weight:650;color:var(--accent-ink);cursor:pointer}
.grid-t tr.focus td{animation:pulse 1.8s ease-out 1}
@keyframes pulse{0%{box-shadow:inset 0 0 0 999px rgba(201,87,26,.28)}100%{box-shadow:inset 0 0 0 999px rgba(201,87,26,0)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.sw.c{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.sw.r{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));border:1px solid var(--line)}

/* Standards */
.std{display:flex;flex-direction:column;gap:6px}
.std-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.std-h .code{font-family:var(--f-display);font-weight:700;font-size:19px}
.std .note{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px;margin:4px 0}
.line{display:grid;grid-template-columns:92px 1fr auto;gap:14px;padding:10px 12px;border-radius:10px;align-items:start;border-left:3px solid transparent}
.line .para{font-family:var(--f-mono);font-size:14px;color:var(--muted);padding-top:2px}
.line .uses{font-size:13px;color:var(--muted);white-space:nowrap}
.line.hl{background:var(--accent-soft);border-left-color:var(--accent)}
.line.hl .para{color:var(--accent-ink);font-weight:700}
.std.dim .line:not(.hl){opacity:.55}
.lib-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(15,16,18,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);z-index:41;overflow:auto;border-left:1px solid var(--line);display:flex;flex-direction:column}
.drawer-h{position:sticky;top:0;background:var(--bg);padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;z-index:2}
.drawer-b{padding:20px 24px 48px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:16px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.x{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:22px;color:var(--muted)}
.x:hover{background:var(--surface);color:var(--ink)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{width:min(680px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:90vw}
.dropveil{position:fixed;inset:12px;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--accent-soft) 85%,transparent);z-index:70;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:650;color:var(--accent-ink);pointer-events:none}
.empty{padding:36px;text-align:center;color:var(--muted)}
.hidden{display:none!important}

@media (max-width:980px){ .g-2,.lib-cols{grid-template-columns:1fr} }
@media (max-width:760px){
  body{font-size:16px}
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;z-index:20;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand span{display:none}
  .nav{flex-direction:row}
  .nav .count,.rail-foot{display:none}
  h1{font-size:25px}
  .issue{grid-template-columns:1fr auto;padding:16px}
  .issue .rank{display:none}
  .issue .meta{grid-column:1/-1}
  .sheet-row{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
  .bar{grid-template-columns:100px 1fr 36px}
  .line{grid-template-columns:72px 1fr}
  .line .uses{grid-column:2}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><div class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span>Audit Test Tracker</span></div>
    <nav class="nav" aria-label="Sections">
      <button data-view="overview">Overview</button>
      <button data-view="issues">Issues <span class="count" id="navIssues"></span></button>
      <button data-view="files">Files <span class="count" id="navFiles"></span></button>
      <button data-view="standards">Standards</button>
      <button data-view="engagement">Engagement</button>
    </nav>
    <div class="rail-foot" id="railEng"></div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="viewTitle">Overview</h1><p class="sub" id="engLine"></p></div>
      <div class="actions"><button class="btn" data-act="new-issue">Add issue</button><button class="btn primary" data-act="upload">Upload Excel</button></div>
    </header>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div id="scrim" class="scrim hidden"></div>
<aside id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<div id="dropveil" class="dropveil hidden">Drop to test these files</div>
<input type="file" id="fileIn" accept=".xlsx,.xlsm,.xls,.csv" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===== Audit engine: pure functions (detection, tests, scoring, standards, sample) ===== */

/* ---------- Standards library (paraphrased summaries, not the official text) ---------- */
const REFS = {
  'SSA 200': { group: 'SSA', title: 'Overall Objectives of the Independent Auditor', lines: [
    ['15', 'Plan and perform the audit with professional scepticism, recognising that circumstances may exist that cause the financial statements to be materially misstated.'],
    ['17', 'Obtain sufficient appropriate audit evidence to reduce audit risk to an acceptably low level.'] ] },
  'SSA 230': { group: 'SSA', title: 'Audit Documentation', lines: [
    ['8', 'Document the procedures performed, evidence obtained and conclusions reached so that an experienced auditor with no prior connection to the audit can understand them.'],
    ['9', 'Record the identifying characteristics of the items tested, who performed the work and who reviewed it.'] ] },
  'SSA 240': { group: 'SSA', title: 'The Auditor’s Responsibilities Relating to Fraud', note: 'Paragraph numbers follow the SSA 240 currently in force. SSA 240 (Revised), issued by ISCA in July 2026, applies to audits of periods beginning on or after 15 December 2026 and renumbers its requirements.', lines: [
    ['26', 'Presume there are risks of fraud in revenue recognition and evaluate which types of revenue, transactions or assertions give rise to them.'],
    ['31', 'Treat the risk of management override of controls as present in every entity and as a significant risk.'],
    ['32(a)', 'Test the appropriateness of journal entries and other adjustments made in preparing the financial statements, including entries made at the end of the reporting period.'],
    ['32(b)', 'Review accounting estimates for bias that could result in material misstatement due to fraud.'],
    ['32(c)', 'Evaluate the business rationale of significant transactions that are outside the normal course of business or otherwise appear unusual.'],
    ['A41–A44', 'Application material on journal entry testing: inappropriate entries often show traits such as round numbers, posting to unrelated or seldom-used accounts, posting by unexpected users, period-end timing, or little or no explanation.'] ] },
  'SSA 265': { group: 'SSA', title: 'Communicating Deficiencies in Internal Control', lines: [
    ['8', 'Determine whether deficiencies in internal control identified during the audit are, individually or together, significant deficiencies.'],
    ['9', 'Communicate significant deficiencies in internal control in writing to those charged with governance on a timely basis.'] ] },
  'SSA 315': { group: 'SSA', title: 'Identifying and Assessing the Risks of Material Misstatement (Revised 2021)', lines: [
    ['28', 'Identify the risks of material misstatement and determine the relevant assertions for significant classes of transactions, account balances and disclosures.'],
    ['31', 'Assess inherent risk by considering the likelihood and magnitude of misstatement and how inherent risk factors affect susceptibility to misstatement.'],
    ['32', 'Determine whether any of the assessed risks of material misstatement are significant risks.'] ] },
  'SSA 320': { group: 'SSA', title: 'Materiality in Planning and Performing an Audit', lines: [
    ['10', 'Determine materiality for the financial statements as a whole when establishing the overall audit strategy.'],
    ['11', 'Determine performance materiality to reduce to an appropriately low level the chance that uncorrected and undetected misstatements together exceed materiality.'],
    ['12', 'Revise materiality if information comes to light during the audit that would have led to a different amount initially.'] ] },
  'SSA 330': { group: 'SSA', title: 'The Auditor’s Responses to Assessed Risks', lines: [
    ['6', 'Design and perform further audit procedures whose nature, timing and extent respond to the assessed risks at the assertion level.'],
    ['18', 'Perform substantive procedures for each material class of transactions, account balance and disclosure, whatever the assessed risk.'],
    ['20', 'Agree or reconcile the financial statements to the underlying accounting records, and examine material journal entries and other adjustments made in preparing them.'],
    ['21', 'Where a risk is significant, perform substantive procedures that respond specifically to that risk.'] ] },

/* ---------- Risk scoring ---------- */
const FRAUDISH = ['unusual', 'rpt', 'round', 'yearend', 'tb', 'benford'];
function scoreIssue(iss, eng) {
  const M = +eng.materiality || 0, PM = M * (+eng.pmPct || 75) / 100, CT = M * (+eng.trivialPct || 5) / 100;
  const a = Math.abs(+iss.amount || 0);
  let mag;
  if (iss.population) mag = 20;
  else if (M > 0) mag = a >= M ? 45 : a >= PM ? 35 : a >= 0.25 * M ? 25 : a >= CT ? 12 : 0;
  else mag = a > 0 ? 12 : 0;
  const w = TESTS[iss.test] ? TESTS[iss.test].w : 24;
  const score = Math.min(100, mag + w + (iss.boost || 0));
  const risk = score >= 55 ? 'High' : score >= 35 ? 'Medium' : 'Low';
  let priority;
  if (risk === 'High') priority = (PM > 0 && a >= PM) || FRAUDISH.includes(iss.test) ? 'P1' : 'P2';
  else if (risk === 'Medium') priority = PM > 0 && a >= PM ? 'P2' : 'P3';
  else priority = 'P4';
  return { score, risk, priority };
}

const STATUSES = ['Open', 'In review', 'Unadjusted', 'Adjusted', 'Cleared'];
const CLOSED = ['Adjusted', 'Cleared'];
const RISKS = ['High', 'Medium', 'Low'];
const PRIS = ['P1', 'P2', 'P3', 'P4'];
const PRI_LABEL = { P1: 'P1 – Immediate', P2: 'P2 – High', P3: 'P3 – Normal', P4: 'P4 – Low' };
const MIS_TYPES = ['', 'Factual', 'Judgemental', 'Projected'];
const MAX_ROWS = 20000;

let S = null, storageOK = true, view = 'overview';
let filt = { q: '', risk: '', pri: '', cat: '', status: 'active', file: '' }, sortBy = 'rank';
let openId = null, hl = null, grid = null, expanded = {}, confirmDel = false;

/* ---------- Persistence ---------- */
function load() { try { const r = localStorage.getItem(LS_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); if (!storageOK) { storageOK = true; renderBanner(); } }
  catch (e) { storageOK = false; renderBanner(); }
}
function blankState() { return { engagement: { entity: '', periodEnd: '', currency: 'SGD', materiality: 0, pmPct: 75, trivialPct: 5 }, files: [], issues: [], seq: 1, sample: false, disabled: [] }; }
function uid() { return Math.random().toString(36).slice(2, 9); }

/* ---------- Helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cur = () => S.engagement.currency || 'SGD';
function money(n, withCur = true) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  const s = Math.abs(n).toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (withCur ? cur() + ' ' : '') + (n < 0 ? '(' + s + ')' : s);
}
function moneyShort(n) {
  const a = Math.abs(n); let s;
  if (a >= 1e6) s = (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'm'; else if (a >= 1e4) s = Math.round(a / 1e3) + 'k'; else s = a.toLocaleString('en-SG', { maximumFractionDigits: 0 });
  return cur() + ' ' + s;
}
function niceDate(iso) { if (!iso) return '—'; const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return d + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][m - 1] + ' ' + y; }
const M = () => +S.engagement.materiality || 0;
const PM = () => M() * (+S.engagement.pmPct || 75) / 100;
const CT = () => M() * (+S.engagement.trivialPct || 5) / 100;
const fileOf = id => S.files.find(f => f.id === id);
function sheetOf(fid, sid) { const f = fileOf(fid); return f ? f.sheets.find(s => s.id === sid) : null; }
function excelRow(sh, r) { return r + (sh.originR || 0) + 1; }
function cellRef(sh, r, c) { return colName(c + (sh.originC || 0)) + excelRow(sh, r); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 3600); }
const isClosed = i => CLOSED.includes(i.status);

/* ---------- Ingest ---------- */
function normVal(v) {
  if (v instanceof Date) { if (isNaN(v)) return null; return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0'); }
  if (typeof v === 'string') { const t = v.trim(); return t === '' ? null : t; }
  if (typeof v === 'boolean') return String(v);
  return v === undefined ? null : v;
}
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += ch;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(v => { const n = num(v); return n !== null && /^[\s(\-$S]*[\d,.]+\)?\s*$/.test(v) ? n : normVal(v); }));
}
async function readFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv' || ext === 'txt') return [{ name: file.name.replace(/\.[^.]+$/, ''), rows: parseCSV(await file.text()), originR: 0, originC: 0 }];
  if (!window.XLSX) throw new Error('The Excel reader could not load. Check your connection, or save the sheet as CSV and upload that.');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  return wb.SheetNames.map(n => {
    const ws = wb.Sheets[n]; let originR = 0, originC = 0;
    if (ws['!ref']) { const rg = XLSX.utils.decode_range(ws['!ref']); originR = rg.s.r; originC = rg.s.c; }
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true }).map(r => r.map(normVal));
    return { name: n, rows, originR, originC };
  });
}
function makeFile(name, raws) {
  const f = { id: uid(), name, uploadedAt: new Date().toISOString(), sheets: [] };
  raws.forEach(raw => {
    while (raw.rows.length && !raw.rows[raw.rows.length - 1].some(v => v !== null && v !== '')) raw.rows.pop();
    if (!raw.rows.length) return;
    if (raw.rows.length > MAX_ROWS) { raw.rows = raw.rows.slice(0, MAX_ROWS); toast(raw.name + ': only the first ' + MAX_ROWS.toLocaleString() + ' rows were kept.'); }
    const sh = prepareSheet(raw); sh.id = uid(); f.sheets.push(sh);
  });
  return f;
}
async function ingest(files) {
  const list = [...files].filter(f => /\.(xlsx|xlsm|xls|csv|txt)$/i.test(f.name));
  if (!list.length) { toast('Choose an Excel (.xlsx, .xls) or CSV file.'); return; }
  if (S.sample) { removeSample(); toast('Sample data removed. Set materiality and period end under Engagement.'); }
  let n0 = S.issues.length, last = null;
  for (const file of list) {
    try {
      const raws = await readFile(file);
      const f = makeFile(file.name, raws);
      if (!f.sheets.length) { toast(file.name + ' has no data.'); continue; }
      S.files.push(f); f.sheets.forEach(sh => runSheet(f, sh)); last = f;
    } catch (e) { toast('Could not read ' + file.name + ': ' + e.message); }
  }
  save();
  if (last) {
    const found = S.issues.length - n0;
    filt = Object.assign({}, filt, { file: list.length === 1 ? last.id : '', status: 'active' });
    toast(found + ' issue' + (found === 1 ? '' : 's') + ' found in ' + (list.length === 1 ? last.name : list.length + ' files') + '.');
    go('issues');
  }
}
function removeSample() {
  const ids = S.files.filter(f => f.sample).map(f => f.id);
  S.files = S.files.filter(f => !ids.includes(f.id));
  S.issues = S.issues.filter(i => !ids.includes(i.fileId));
  S.engagement = blankState().engagement; S.sample = false; grid = null;
}
function loadSample() {
  const smp = buildSample();
  S.engagement = smp.engagement;
  const f = makeFile(smp.fileName, smp.sheets); f.sample = true;
  S.files.push(f); S.sample = true;
  f.sheets.forEach(sh => runSheet(f, sh));
  save();
}

/* ---------- Testing ---------- */
function newIssue(f, file, sh, key) {
  return Object.assign({
    id: 'ISS-' + String(S.seq++).padStart(3, '0'), key, fileId: file.id, sheetId: sh.id, status: 'Open', notes: '',
    misType: f.misType || '', adj: f.adj ?? null, auto: true, touched: false, override: false, created: new Date().toISOString()
  }, f);
}
function runSheet(file, sh) {
  const found = analyse(sh, S.engagement, S.disabled);
  const keys = new Set();
  found.forEach(f => {
    const key = sh.id + '|' + f.test + '|' + f.rows.join(',') + '|' + f.cells.map(c => c.join(':')).join(',') + (f.population ? '|pop' : '');
    keys.add(key);
    const ex = S.issues.find(i => i.key === key);
    if (ex) Object.assign(ex, { amount: f.amount, title: f.title, detail: f.detail, rows: f.rows, cells: f.cells, ssa: f.ssa, sfrs: f.sfrs, boost: f.boost || 0 });
    else S.issues.push(newIssue(f, file, sh, key));
  });
  S.issues = S.issues.filter(i => !(i.auto && i.sheetId === sh.id && !keys.has(i.key) && !i.touched));
  sh.tested = true; sh.testedAt = new Date().toISOString();
  rescore();
}
function runAll() { S.files.forEach(f => f.sheets.forEach(sh => runSheet(f, sh))); save(); }
function rescore() {
  S.issues.forEach(i => { const sc = scoreIssue(i, S.engagement); i.score = sc.score; if (!i.override) { i.risk = sc.risk; i.priority = sc.priority; } });
}
function ranked(list) {
  const pr = p => PRIS.indexOf(p);
  return [...list].sort((a, b) => (isClosed(a) - isClosed(b)) || (pr(a.priority) - pr(b.priority)) || (b.score - a.score) || (Math.abs(b.amount || 0) - Math.abs(a.amount || 0)));
}
function rankMap() { const m = {}; ranked(S.issues).forEach((i, n) => m[i.id] = n + 1); return m; }
function stats() {
  const open = S.issues.filter(i => !isClosed(i));
  const rowsAmt = new Map();
  open.forEach(i => { if (i.population) return; const k = i.sheetId + '|' + (i.rows[0] ?? i.id); rowsAmt.set(k, Math.max(rowsAmt.get(k) || 0, Math.abs(i.amount || 0))); });
  const flagged = [...rowsAmt.values()].reduce((s, v) => s + v, 0);
  const mis = S.issues.filter(i => i.misType && !isClosed(i)).reduce((s, i) => s + Math.abs(i.adj ?? i.amount ?? 0), 0);
  return { open, flagged, mis, high: open.filter(i => i.risk === 'High').length, p1: open.filter(i => i.priority === 'P1').length };
}

/* ---------- Routing ---------- */
function go(v) { if (location.hash !== '#' + v) location.hash = v; else { view = v; render(); } }
function route() { const h = location.hash.replace('#', ''); view = VIEWS[h] ? h : 'overview'; window.scrollTo(0, 0); render(); }

/* ---------- Render: shell ---------- */
let rendering = false;
function render() {
  if (rendering) { setTimeout(render, 0); return; }
  rendering = true;
  try { renderNow(); } finally { rendering = false; }
}
function renderNow() {
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.view === view ? 'page' : 'false'));
  const st = stats();
  document.getElementById('navIssues').textContent = st.open.length;
  document.getElementById('navFiles').textContent = S.files.length;
  document.getElementById('viewTitle').textContent = VIEWS[view];
  const e = S.engagement;
  document.getElementById('engLine').innerHTML = (e.entity || M() || e.periodEnd)
    ? esc(e.entity || 'Unnamed engagement') + ' · Period end ' + niceDate(e.periodEnd) + ' · Materiality ' + (M() ? money(M()) : 'not set')
    : 'No engagement set up yet. <button class="btn ghost" data-go="engagement">Set up engagement</button>';
  document.getElementById('railEng').innerHTML = e.entity ? '<strong>' + esc(e.entity) + '</strong><span>FYE ' + niceDate(e.periodEnd) + '</span><span>SFRS(I) · SSA</span>' : '<span>SFRS(I) · SSA</span>';
  renderBanner();
  const el = document.getElementById('view');
  el.innerHTML = ({ overview: vOverview, issues: vIssues, files: vFiles, standards: vStandards, engagement: vEngagement })[view]();
  if (view === 'files' && grid && grid.focus !== undefined) { const tr = document.getElementById('focusRow'); if (tr) setTimeout(() => tr.scrollIntoView({ block: 'center' }), 30); }
  if (view === 'standards' && hl && hl.scroll) { const ln = document.querySelector('.line.hl'); if (ln) setTimeout(() => ln.scrollIntoView({ block: 'center' }), 30); hl.scroll = false; }
  renderDrawer();
}
function renderBanner() {
  const b = []; const e = S.engagement;
  if (!storageOK) b.push('<div class="banner warn"><span>Browser storage is full, so recent changes will not be kept after you close this page. Remove a large file to free space.</span></div>');
  if (S.sample) b.push('<div class="banner"><span><strong>Sample data.</strong> This is an example engagement with planted issues. Upload your own Excel file to replace it.</span><button class="btn sm" data-act="remove-sample">Remove sample</button></div>');
  else if (S.files.length && (!M() || !e.periodEnd)) b.push('<div class="banner"><span>Set materiality and the period end to turn on the cut-off, key item and materiality-based risk ranking.</span><button class="btn sm" data-go="engagement">Open engagement</button></div>');
  document.getElementById('banner').innerHTML = b.join('');
}

/* ---------- Shared bits ---------- */
function chips(i) {
  return '<span class="chip ' + i.risk + '"><span class="dot"></span>' + i.risk + ' risk</span>' +
    '<span class="chip pri ' + i.priority + '">' + i.priority + '</span>' +
    '<span class="chip">' + esc(i.category) + '</span>';
}
function refBtns(i) {
  return (i.ssa || []).concat(i.sfrs || []).map(([s, p]) => '<button class="ref" data-act="ref" data-iss="' + i.id + '" data-std="' + esc(s) + '" data-p="' + esc(p) + '">' + esc(s) + ' <span class="p">¶' + esc(p) + '</span></button>').join('');
}
function locHtml(i, withBtn = true) {
  const f = fileOf(i.fileId), sh = f && sheetOf(i.fileId, i.sheetId);
  if (!f || !sh) return '<div class="loc"><span>Manual issue – no file location</span></div>';
  let where;
  if (i.population) where = 'whole population (' + dataRows(sh).filter(x => !x.total).length + ' rows)';
  else if (i.rows.length > 1) where = 'Rows ' + i.rows.slice(0, 4).map(r => excelRow(sh, r)).join(', ') + (i.rows.length > 4 ? '…' : '');
  else if (i.rows.length) where = 'Row ' + excelRow(sh, i.rows[0]);
  else where = 'Sheet level';
  const cells = (i.cells || []).slice(0, 4).map(([r, c]) => '<span class="cellref">' + cellRef(sh, r, c) + '</span>').join('');
  return '<div class="loc"><span class="path">' + esc(f.name) + ' › ' + esc(sh.name) + ' › ' + where + '</span>' + cells +
    (withBtn && !i.population && i.rows.length ? '<button class="btn ghost sm" data-act="locate" data-iss="' + i.id + '">Show in file</button>' : '') + '</div>';
}
function issueCard(i, rank) {
  return '<article class="card issue ' + i.risk + (isClosed(i) ? ' closed' : '') + '" data-act="open" data-iss="' + i.id + '" tabindex="0" aria-label="' + esc(i.title) + '">' +
    '<div class="rank">#' + rank + '</div>' +
    '<div class="t">' + esc(i.title) + '</div>' +
    '<div class="amt">' + (i.population ? '<span class="muted small">Population</span>' : money(i.amount)) + '</div>' +
    '<div class="meta"><div class="row-wrap">' + chips(i) + '<span class="status">' + esc(i.status) + (i.misType ? ' · ' + i.misType + ' misstatement' : '') + ' · ' + i.id + '</span></div>' +
    locHtml(i) + '<div class="row-wrap">' + refBtns(i) + '</div></div></article>';
}
function opt(v, label, sel) { return '<option value="' + esc(v) + '"' + (String(v) === String(sel) ? ' selected' : '') + '>' + esc(label) + '</option>'; }

/* ---------- View: overview ---------- */
function vOverview() {
  const st = stats(), rk = rankMap();
  if (!S.files.length && !S.issues.length) return emptyStart();
  const byCat = CATS.map(c => [c, st.open.filter(i => i.category === c).length]).filter(x => x[1]);
  const maxC = Math.max(1, ...byCat.map(x => x[1]));
  const byRisk = RISKS.map(r => [r, st.open.filter(i => i.risk === r).length]);
  const tot = Math.max(1, st.open.length);
  const scale = Math.max(M() * 1.15, st.mis * 1.08, 1);
  const pct = v => Math.min(100, v / scale * 100);
  const top = ranked(st.open).slice(0, 6);
  const misState = !M() ? 'Set materiality to evaluate' : st.mis >= M() ? 'Exceeds materiality' : st.mis >= PM() ? 'Above performance materiality' : 'Below performance materiality';
  return '<div class="stack">' +
    '<div class="grid g-tiles">' +
      tile('Open issues', st.open.length, S.issues.length - st.open.length + ' closed') +
      tile('High risk', st.high, 'of ' + st.open.length + ' open', st.high ? 'accent' : '') +
      tile('P1 priority', st.p1, 'need attention first') +
      tile('Amount flagged', moneyShort(st.flagged), 'unique rows, open issues') +
    '</div>' +
    '<div class="grid g-2">' +
      '<section class="card"><div class="card-h"><h2>Top priorities</h2><button class="btn ghost" data-go="issues">All issues →</button></div>' +
        (top.length ? '<div class="top5">' + top.map(i => '<button data-act="open" data-iss="' + i.id + '"><span class="chip pri ' + i.priority + '">' + i.priority + '</span><span class="tt">' + esc(i.title) + '<br><span class="muted small">' + esc(i.category) + ' · ' + (i.ssa[0] ? esc(i.ssa[0][0] + ' ¶' + i.ssa[0][1]) : '') + '</span></span><span class="num small">' + (i.population ? '' : money(i.amount, false)) + '</span></button>').join('') + '</div>' : '<p class="muted">No open issues.</p>') +
      '</section>' +
      '<div class="stack">' +
        '<section class="card"><div class="card-h"><h2>Misstatements not yet corrected</h2><span class="muted small">SSA 450 ¶' + '5, 11</span></div>' +
          '<div class="num" style="font-family:var(--f-display);font-size:28px;font-weight:650">' + money(st.mis) + '</div><div class="muted small">' + misState + '</div>' +
          (M() ? '<div class="meter" role="img" aria-label="Misstatements ' + money(st.mis) + ' against materiality ' + money(M()) + '"><div class="fill" style="width:' + pct(st.mis) + '%"></div>' +
            '<div class="mk" style="left:' + pct(CT()) + '%"><span class="b">Trivial ' + moneyShort(CT()) + '</span></div>' +
            '<div class="mk" style="left:' + pct(PM()) + '%"><span>PM ' + moneyShort(PM()) + '</span></div>' +
            '<div class="mk" style="left:' + pct(M()) + '%"><span class="b">Materiality ' + moneyShort(M()) + '</span></div></div>' : '') +
          '<p class="muted small">Counts issues marked as factual, judgemental or projected that are not yet adjusted.</p></section>' +
        '<section class="card"><div class="card-h"><h2>By risk level</h2></div><div class="bars">' + byRisk.map(([r, n]) => '<div class="bar"><span>' + r + '</span><div class="track"><div class="fill ' + r + '" style="width:' + (n / tot * 100) + '%"></div></div><span class="n">' + n + '</span></div>').join('') + '</div></section>' +
      '</div>' +
    '</div>' +
    '<div class="grid g-2">' +
      '<section class="card"><div class="card-h"><h2>By risk area</h2></div><div class="bars">' + (byCat.length ? byCat.map(([c, n]) => '<div class="bar"><span>' + esc(c) + '</span><div class="track"><div class="fill" style="width:' + (n / maxC * 100) + '%"></div></div><span class="n">' + n + '</span></div>').join('') : '<p class="muted">Nothing open.</p>') + '</div></section>' +
      '<section class="card"><div class="card-h"><h2>Files tested</h2><button class="btn ghost" data-go="files">Manage →</button></div>' +
        S.files.map(f => '<div style="padding:8px 0;border-top:1px solid var(--line)"><strong>' + esc(f.name) + '</strong><div class="muted small">' + f.sheets.map(s => esc(s.name) + ' (' + S.issues.filter(i => i.sheetId === s.id && !isClosed(i)).length + ')').join(' · ') + '</div></div>').join('') +
      '</section>' +
    '</div></div>';
}
function tile(k, v, s, cls = '') { return '<div class="card tile ' + cls + '"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; }
function emptyStart() {
  return '<div class="card"><div class="drop" data-drop><div class="big">Upload an Excel file to start testing</div><p class="muted">General ledger, trial balance, receivables ageing, inventory or sales listings (.xlsx, .xls or .csv). Each sheet is tested automatically.</p><div class="row-wrap" style="justify-content:center"><button class="btn primary" data-act="upload">Choose files</button><button class="btn" data-act="load-sample">Load sample engagement</button></div></div></div>';
}

/* ---------- View: issues ---------- */
function filtered() {
  const q = filt.q.trim().toLowerCase();
  return S.issues.filter(i => {
    if (filt.risk && i.risk !== filt.risk) return false;
    if (filt.pri && i.priority !== filt.pri) return false;
    if (filt.cat && i.category !== filt.cat) return false;
    if (filt.file && i.fileId !== filt.file) return false;
    if (filt.status === 'active' && isClosed(i)) return false;
    if (filt.status && filt.status !== 'active' && i.status !== filt.status) return false;
    if (q) { const hay = [i.id, i.title, i.detail, i.category, i.notes, ...(i.ssa || []).map(x => x.join(' ')), ...(i.sfrs || []).map(x => x.join(' '))].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
}
function vIssues() {
  const rk = rankMap();
  let list = filtered();
  if (sortBy === 'rank') list = ranked(list);
  else if (sortBy === 'amount') list.sort((a, b) => Math.abs(b.amount || 0) - Math.abs(a.amount || 0));
  else if (sortBy === 'newest') list.sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  else if (sortBy === 'location') list.sort((a, b) => (a.fileId + a.sheetId).localeCompare(b.fileId + b.sheetId) || ((a.rows[0] ?? 0) - (b.rows[0] ?? 0)));
  const cats = [...new Set(S.issues.map(i => i.category))];
  return '<div class="toolbar">' +
    '<input type="search" id="fq" placeholder="Search issues, notes or a reference like SSA 240" value="' + esc(filt.q) + '" aria-label="Search issues">' +
    '<select id="frisk" aria-label="Risk">' + opt('', 'All risk levels', filt.risk) + RISKS.map(r => opt(r, r + ' risk', filt.risk)).join('') + '</select>' +
    '<select id="fpri" aria-label="Priority">' + opt('', 'All priorities', filt.pri) + PRIS.map(p => opt(p, PRI_LABEL[p], filt.pri)).join('') + '</select>' +
    '<select id="fcat" aria-label="Risk area">' + opt('', 'All risk areas', filt.cat) + cats.map(c => opt(c, c, filt.cat)).join('') + '</select>' +

function gridHtml(rk) {

function snippet(i, sh) {

    prev = r;
  });
  return t + '</tbody></table></div>';
}

    '<label class="field full"><span>Assertion</span><input type="text" id="ni_assert" placeholder="e.g. Existence, Cut-off, Valuation"></label>' +
    '<label class="field full"><span>Standards (hold Ctrl or Cmd to pick several)</span><select id="ni_refs" multiple size="7">' + refs.map(([v, l]) => opt(v, l, '')).join('') + '</select></label>' +
    '<label class="field full"><span>What you found</span><textarea id="ni_detail"></textarea></label>' +
    '<div class="full row-wrap" style="justify-content:flex-end"><button type="button" class="btn" data-act="close-modal">Cancel</button><button type="submit" class="btn primary">Add issue</button></div></form>');
}
function saveNewIssue() {
  const v = id => document.getElementById(id).value;
  const title = v('ni_title').trim(); if (!title) { toast('Give the issue a title.'); return; }
  let fileId = null, sheetId = null, rows = [], cells = [];
  if (v('ni_sheet')) {
    [fileId, sheetId] = v('ni_sheet').split('|'); const sh = sheetOf(fileId, sheetId);
    const er = parseInt(v('ni_row'), 10);
    if (er) { const r = er - (sh.originR || 0) - 1; if (r >= 0) { rows = [r]; const L = v('ni_col').trim().toUpperCase(); if (/^[A-Z]{1,3}$/.test(L)) { let c = 0; for (const ch of L) c = c * 26 + ch.charCodeAt(0) - 64; cells = [[r, c - 1 - (sh.originC || 0)]]; } } }
  }
  const refs = [...document.getElementById('ni_refs').selectedOptions].map(o => o.value.split('|'));
  const iss = { id: 'ISS-' + String(S.seq++).padStart(3, '0'), key: 'manual|' + uid(), test: 'manual', fileId, sheetId, rows, cells, amount: parseFloat(v('ni_amount')) || 0,
    title, detail: v('ni_detail').trim(), category: v('ni_cat'), assertion: v('ni_assert').trim(), ssa: refs.filter(r => REFS[r[0]].group === 'SSA'), sfrs: refs.filter(r => REFS[r[0]].group !== 'SSA'),
    status: 'Open', notes: '', misType: '', adj: null, auto: false, touched: true, override: true, risk: v('ni_risk'), priority: v('ni_pri'), created: new Date().toISOString() };
  S.issues.push(iss); rescore(); save(); closeModal(); render(); openIssue(iss.id);
}
async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast(label + ' copied to the clipboard.'); }
  catch (e) { modal('<div class="card-h"><h2>' + esc(label) + '</h2><button class="x" data-act="close-modal" aria-label="Close">×</button></div><p class="muted small" style="margin-bottom:10px">Your browser blocked automatic copying. Select all of the text below and copy it.</p><textarea id="copyArea" style="min-height:280px;font-family:var(--f-mono);font-size:13px">' + esc(text) + '</textarea>'); const a = document.getElementById('copyArea'); a.select(); }
}
function issuesCSV() {
  const rk = rankMap();
  const head = ['Rank', 'ID', 'Title', 'Risk', 'Priority', 'Score', 'Risk area', 'Assertion', 'Status', 'Amount', 'Misstatement type', 'Proposed adjustment', 'File', 'Sheet', 'Excel rows', 'Cells', 'SSA references', 'SFRS(I) references', 'Finding', 'Notes'];
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = ranked(S.issues).map(i => { const f = fileOf(i.fileId), sh = f && sheetOf(i.fileId, i.sheetId);
    return [rk[i.id], i.id, i.title, i.risk, i.priority, i.score, i.category, i.assertion, i.status, i.population ? '' : (i.amount || 0).toFixed(2), i.misType, i.adj ?? '', f ? f.name : '', sh ? sh.name : '', sh ? i.rows.map(r => excelRow(sh, r)).join(' ') : '', sh ? (i.cells || []).map(([r, c]) => cellRef(sh, r, c)).join(' ') : '', (i.ssa || []).map(x => x[0] + ' para ' + x[1]).join('; '), (i.sfrs || []).map(x => x[0] + ' para ' + x[1]).join('; '), i.detail, i.notes].map(q).join(','); });
  return [head.join(',')].concat(lines).join('\n');
}

/* ---------- Events ---------- */
function bind() {
  document.addEventListener('click', e => {
    const goEl = e.target.closest('[data-go]'); if (goEl) { e.preventDefault(); go(goEl.dataset.go); return; }
    const nav = e.target.closest('.nav button'); if (nav) { go(nav.dataset.view); return; }
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act, iss = el.dataset.iss;
    switch (a) {
      case 'upload': document.getElementById('fileIn').click(); break;
      case 'open': openIssue(iss); break;
      case 'close': closeDrawer(); break;
      case 'locate': { const i = S.issues.find(x => x.id === iss); grid = { fileId: i.fileId, sheetId: i.sheetId, focus: i.rows[0], start: Math.max(0, i.rows[0] - 40) }; openId = null; go('files'); break; }
      case 'ref': { const i = S.issues.find(x => x.id === iss); hl = { issue: iss, refs: [[el.dataset.std, el.dataset.p]], scroll: true }; openId = null; go('standards'); break; }
      case 'ref-all': { const i = S.issues.find(x => x.id === iss); hl = { issue: iss, refs: (i.ssa || []).concat(i.sfrs || []), scroll: true }; openId = null; go('standards'); break; }
      case 'ref-issues': filt = { q: el.dataset.std + ' ' + el.dataset.p, risk: '', pri: '', cat: '', status: '', file: '' }; go('issues'); break;
      case 'clear-hl': hl = null; render(); break;
      case 'new-issue': newIssueModal(); break;
      case 'close-modal': closeModal(); break;
      case 'view-sheet': grid = { fileId: el.dataset.file, sheetId: el.dataset.sheet, start: 0 }; render(); document.getElementById('gridCard').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
      case 'close-grid': grid = null; render(); break;
      case 'page': grid.start = Math.max(0, (grid.start || 0) + (+el.dataset.d) * 200); grid.focus = undefined; render(); document.getElementById('gridCard').scrollIntoView({ block: 'start' }); break;
      case 'toggle-map': expanded[el.dataset.sheet] = !expanded[el.dataset.sheet]; render(); break;
      case 'run-file': { const f = fileOf(el.dataset.file); const n0 = S.issues.length; f.sheets.forEach(sh => runSheet(f, sh)); save(); render(); toast('Tests re-run on ' + f.name + '.'); break; }
      case 'file-issues': filt = { q: '', risk: '', pri: '', cat: '', status: 'active', file: el.dataset.file }; go('issues'); break;
      case 'remove-file': { const f = fileOf(el.dataset.file); modal('<h2 style="margin-bottom:10px">Remove ' + esc(f.name) + '?</h2><p class="muted">This removes the file and its ' + S.issues.filter(i => i.fileId === f.id).length + ' issues from this browser.</p><div class="row-wrap" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="do-remove-file" data-file="' + f.id + '">Remove file</button></div>'); break; }
      case 'do-remove-file': { const id = el.dataset.file; S.files = S.files.filter(f => f.id !== id); S.issues = S.issues.filter(i => i.fileId !== id); if (grid && grid.fileId === id) grid = null; if (!S.files.some(f => f.sample)) S.sample = false; save(); closeModal(); render(); break; }
      case 'remove-sample': removeSample(); save(); render(); toast('Sample data removed.'); break;
      case 'load-sample': if (S.sample) break; loadSample(); go('overview'); toast('Sample engagement loaded.'); break;
      case 'copy-csv': copyText(issuesCSV(), 'Issue log CSV'); break;
      case 'copy-backup': copyText(JSON.stringify(S), 'Backup'); break;
      case 'restore': modal('<div class="card-h"><h2>Restore from backup</h2><button class="x" data-act="close-modal" aria-label="Close">×</button></div><p class="muted small" style="margin-bottom:10px">Paste a backup copied from this app. It replaces everything currently saved.</p><textarea id="restoreArea" style="min-height:200px;font-family:var(--f-mono);font-size:13px"></textarea><div class="row-wrap" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="do-restore">Restore</button></div>'); break;
      case 'do-restore': try { const d = JSON.parse(document.getElementById('restoreArea').value); if (!d || !Array.isArray(d.files) || !Array.isArray(d.issues)) throw 0; S = Object.assign(blankState(), d); save(); closeModal(); grid = null; hl = null; go('overview'); toast('Backup restored.'); } catch (x) { toast('That text is not a valid backup from this app.'); } break;
      case 'clear-all': modal('<h2 style="margin-bottom:10px">Clear all data?</h2><p class="muted">Files, issues, notes and engagement settings will be deleted from this browser. Copy a backup first if you need them.</p><div class="row-wrap" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-act="close-modal">Cancel</button><button class="btn primary" data-act="do-clear">Clear everything</button></div>'); break;
      case 'do-clear': S = blankState(); save(); grid = null; hl = null; openId = null; closeModal(); go('overview'); break;
      case 'reset-risk': { const i = S.issues.find(x => x.id === openId); i.override = false; rescore(); save(); render(); break; }
      case 'ask-del': confirmDel = true; renderDrawer(); break;
      case 'cancel-del': confirmDel = false; renderDrawer(); break;
      case 'delete': S.issues = S.issues.filter(x => x.id !== openId); openId = null; confirmDel = false; save(); render(); toast('Issue deleted.'); break;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!document.getElementById('modal').classList.contains('hidden')) closeModal(); else if (openId) closeDrawer(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.issue, td.hit')) { e.preventDefault(); openIssue(e.target.dataset.iss); }
  });
  document.getElementById('scrim').addEventListener('click', closeDrawer);
  document.addEventListener('submit', e => { if (e.target.id === 'niForm') { e.preventDefault(); saveNewIssue(); } });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'fq') { filt.q = t.value; refreshList(); }
    else if (t.id === 'stdq') { hl = Object.assign(hl || { refs: [] }, { q: t.value }); const pos = t.selectionStart; render(); const n = document.getElementById('stdq'); n.focus(); n.setSelectionRange(pos, pos); }
    else if (t.dataset.ed === 'notes') { const i = S.issues.find(x => x.id === openId); i.notes = t.value; i.touched = true; save(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    const fmap = { frisk: 'risk', fpri: 'pri', fcat: 'cat', fstatus: 'status', ffile: 'file' };
    if (fmap[t.id]) { filt[fmap[t.id]] = t.value; refreshList(); return; }
    if (t.id === 'fsort') { sortBy = t.value; refreshList(); return; }
    if (t.id && t.id.startsWith('e_')) {
      const k = t.id.slice(2); S.engagement[k] = ['materiality', 'pmPct', 'trivialPct'].includes(k) ? (parseFloat(t.value) || 0) : t.value.trim();
      runAll(); render(); toast('Saved. Tests re-run with the new settings.'); return;
    }
    if (t.dataset.ed) {
      const i = S.issues.find(x => x.id === openId), k = t.dataset.ed;
      if (k === 'adj') i.adj = t.value === '' ? null : parseFloat(t.value);
      else if (k !== 'notes') i[k] = t.value;
      if (k === 'risk' || k === 'priority') i.override = true;
      i.touched = true; save(); render(); return;
    }
    if (t.dataset.ch) {
      const f = fileOf(t.dataset.file), sh = f && sheetOf(t.dataset.file, t.dataset.sheet);
      if (t.dataset.ch === 'type') sh.type = t.value;
      else if (t.dataset.ch === 'header') { const r = (parseInt(t.value, 10) || 1) - (sh.originR || 0) - 1; sh.headerRow = Math.max(0, Math.min(sh.rows.length - 1, r)); sh.map = detectMap(sh.rows[sh.headerRow] || []); }
      else if (t.dataset.ch === 'map') sh.map[t.dataset.key] = t.value === '' ? null : +t.value;
      else if (t.dataset.ch === 'test') { const id = t.dataset.test; S.disabled = t.checked ? S.disabled.filter(x => x !== id) : S.disabled.concat(id); runAll(); render(); return; }
      runSheet(f, sh); save(); render(); toast('Tests re-run on ' + sh.name + '.');
    }
  });
  const fin = document.getElementById('fileIn');
  fin.addEventListener('change', () => { if (fin.files.length) ingest(fin.files); fin.value = ''; });
  let depth = 0; const veil = document.getElementById('dropveil');
  window.addEventListener('dragenter', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { depth++; veil.classList.remove('hidden'); } });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) veil.classList.add('hidden'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); depth = 0; veil.classList.add('hidden'); if (e.dataTransfer.files.length) ingest(e.dataTransfer.files); });
}
function refreshList() {
  if (view !== 'issues') return;
  const q = document.getElementById('fq'), pos = q ? q.selectionStart : 0, had = document.activeElement && document.activeElement.id;
  document.getElementById('view').innerHTML = vIssues();
  const el = had && document.getElementById(had); if (el) { el.focus(); if (had === 'fq') el.setSelectionRange(pos, pos); }
}

/* ---------- Boot ---------- */
function boot() {
  S = load();
  if (S) S = Object.assign(blankState(), S);
  else { S = blankState(); loadSample(); }
  bind();
  window.addEventListener('hashchange', route);
  route();
}
boot();

</script>
